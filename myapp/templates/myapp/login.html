{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - PixelVillas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/templatemo-villa-agency.css' %}">
  <link rel="stylesheet" href="{% static 'css/pixelvillas.css' %}">
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <section class="auth-card">
          <a class="auth-brand" href="{% url 'index' %}">PixelVillas</a>
          <h1>Log in</h1>
          <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
              {{ form.username }}
              {{ form.username.errors }}
            </div>
            <div class="mb-3">
              <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
              {{ form.password }}
              {{ form.password.errors }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
          <p class="mt-3">Need an account? <a href="{% url 'register' %}">Register</a></p>
          <p><a href="{% url 'index' %}">Back to home</a></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
