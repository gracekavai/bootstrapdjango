{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - PixelVillas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/templatemo-villa-agency.css' %}">
  <link rel="stylesheet" href="{% static 'css/pixelvillas.css' %}">
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <section class="auth-card">
          <a class="auth-brand" href="{% url 'index' %}">PixelVillas</a>
          <h1>Create an account</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Register</button>
          </form>
          <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
          <p><a href="{% url 'index' %}">Back to home</a></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
